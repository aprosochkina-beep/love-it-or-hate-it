<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c19"><title>LOVE IT OR HATE IT? | А.П.ЕЛЬСИН</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#f6f8ff;background:#080c19}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 65% 45% at 0% 4%,#25366a 0%,transparent 72%),radial-gradient(ellipse 50% 45% at 100% 80%,#1a3357 0%,transparent 75%),#080c19;overflow-x:hidden}.wrap{max-width:1120px;margin:0 auto;padding:34px 20px 20px}header{padding:6px 5px 24px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.18em;color:#b5c5e9;display:inline-flex;align-items:center;gap:9px}.eyebrow:before{content:'';width:8px;height:8px;border-radius:50%;background:#c4ff63;box-shadow:0 0 12px #c4ff63}h1{font-size:clamp(38px,6.5vw,77px);line-height:.98;letter-spacing:-.067em;font-weight:950;margin:17px 0 13px;text-transform:uppercase}h1 span{color:#fa8cac}.subtitle{font-size:12px;letter-spacing:.15em;font-weight:750;color:#93a6ca;margin:0}.game-panel{border-radius:28px;background:linear-gradient(150deg,#17223d 0%,#111a2d 65%,#10192b);border:1px solid #354366;box-shadow:0 24px 80px #0007,inset 0 1px #ffffff0d;padding:22px}.example{border:1px solid #39496a;border-radius:18px;padding:16px 20px;background:#202c46;margin-bottom:21px}.example-title{font-size:11px;letter-spacing:.14em;font-weight:900;color:#caff77;margin-bottom:11px}.example-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.example p{font-size:clamp(13px,1.4vw,16px);line-height:1.55;margin:0;color:#eaf0ff}.example strong{color:white}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tile{--accent:#73d7ff;--face:#78ccf6;--ink:#0d2940;min-width:0;border:1px solid #334261;border-radius:20px;padding:17px 7px 12px;background:linear-gradient(180deg,#1d2a45,#152038);cursor:pointer;text-align:center;position:relative;user-select:none;transition:border-color .2s,background .2s,transform .2s}.tile:hover{border-color:#6c7ea7;transform:translateY(-2px)}.tile:active{transform:translateY(1px)}.tile.positive{--accent:#a9ffbf;--face:#a8f1c0;--ink:#17402d}.tile.negative{--accent:#ff9ebf;--face:#ff9fb9;--ink:#58253c}.label{font-size:10px;letter-spacing:.14em;font-weight:900;color:var(--accent);white-space:nowrap}.scene{height:205px;display:grid;place-items:center;perspective:900px;overflow:visible}.cube{--s:clamp(92px,11.5vw,134px);width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;transform:rotateX(-10deg) rotateY(-13deg);will-change:transform;filter:drop-shadow(0 14px 12px #0006);transition:transform .35s}.face{position:absolute;width:100%;height:100%;left:0;top:0;display:grid;place-items:center;text-align:center;padding:9px 6px;background:var(--face);color:var(--ink);font-weight:850;font-size:clamp(10px,1.25vw,15px);line-height:1.15;overflow-wrap:anywhere;backface-visibility:hidden;border:1px solid #ffffff55;border-radius:8px;box-shadow:inset 0 0 19px #ffffff25,inset -5px -6px 12px #0002}.face:nth-child(1){transform:translateZ(calc(var(--s)/2));background:linear-gradient(140deg,#ffffff2c,transparent 50%),var(--face);border:2px solid var(--accent);box-shadow:inset 0 0 12px #fff3,0 0 0 2px #caff7740,0 0 21px #caff7755}.face:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.78)}.face:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}.face:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.83)}.face:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2));filter:brightness(1.09)}.face:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.72)}.tile.landed .face:first-child{animation:neon .42s ease-out}@keyframes neon{0%{box-shadow:0 0 0 2px #caff7700,0 0 0 #caff7700}45%{box-shadow:0 0 0 3px #caff77aa,0 0 35px #caff77aa}100%{box-shadow:inset 0 0 12px #fff3,0 0 0 2px #caff7740,0 0 21px #caff7755}}.shadow{height:11px;width:60%;max-width:120px;margin:-3px auto 6px;border-radius:50%;background:#0008;filter:blur(9px)}.tap{font-size:10px;letter-spacing:.1em;font-weight:800;color:#8ea1c5;margin-top:7px}.rolling .cube{animation:tumble 1.3s cubic-bezier(.22,.68,.2,1) both}.rolling .shadow{animation:shadowroll 1.3s ease-in-out}@keyframes tumble{0%{transform:translateY(0) rotateX(-10deg) rotateY(-13deg) scale(1)}23%{transform:translateY(-46px) rotateX(215deg) rotateY(165deg) rotateZ(26deg) scale(.94)}52%{transform:translateY(-33px) rotateX(505deg) rotateY(450deg) rotateZ(-25deg) scale(1.04)}75%{transform:translateY(-15px) rotateX(690deg) rotateY(700deg) rotateZ(7deg) scale(1.07)}89%{transform:translateY(5px) rotateX(713deg) rotateY(709deg) rotateZ(0) scale(.96)}100%{transform:translateY(0) rotateX(710deg) rotateY(707deg) rotateZ(0) scale(1)}}@keyframes shadowroll{30%,55%{transform:scale(.65);opacity:.4}100%{transform:scale(1);opacity:1}}.actions{display:flex;justify-content:center;gap:12px;margin:22px 0 3px}.mainbtn{flex:1;max-width:480px;min-height:62px;background:linear-gradient(110deg,#d2ff74,#b9fa57);color:#142316;border:0;border-radius:16px;font-size:16px;font-weight:950;letter-spacing:.05em;cursor:pointer;box-shadow:0 6px 0 #78a63c,0 13px 28px #aaff3d26;transition:transform .15s}.mainbtn:hover{filter:brightness(1.06)}.mainbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #78a63c}.mainbtn:disabled{opacity:.75;cursor:wait}.soundbtn{width:65px;border-radius:16px;background:#253450;border:1px solid #526484;color:white;font-size:22px;cursor:pointer}.soundbtn[aria-pressed=false]{opacity:.65}.footer{text-align:center;color:#8b9cbc;font-size:12px;font-weight:650;margin:23px 0 0}button:focus-visible,.tile:focus-visible{outline:3px solid #d1ff74;outline-offset:4px}@media(max-width:760px){.wrap{padding:20px 12px}.game-panel{padding:13px;border-radius:23px}.example{padding:14px 15px;margin-bottom:14px}.example-grid{grid-template-columns:1fr;gap:7px}.board{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:13px 4px 10px}.scene{height:172px}.cube{--s:clamp(90px,25vw,126px)}.face{font-size:clamp(10px,2.65vw,14px)}.actions{margin:18px 0 3px}.mainbtn{font-size:14px;min-height:57px}.soundbtn{width:59px}}@media(prefers-reduced-motion:reduce){.rolling .cube,.rolling .shadow{animation-duration:.2s}}
</style></head><body><main class="wrap"><header><span class="eyebrow">SPOTLIGHT 6 · SPEAKING GAME</span><h1>LOVE IT <span>OR</span><br>HATE IT?</h1><p class="subtitle">FOUR DICE. TWO OPINIONS. YOUR TURN.</p></header><section class="game-panel"><div class="example"><div class="example-title">HOW TO SPEAK · EXAMPLES</div><div class="example-grid"><p><strong>Pizza + delicious:</strong> I love pizza. I think it’s delicious!</p><p><strong>Football + boring:</strong> I hate football. I think it’s boring!</p></div></div><div class="board" id="board"></div><div class="actions"><button class="mainbtn" id="all" type="button">🎲 &nbsp; ROLL ALL FOUR</button><button class="soundbtn" id="sound" type="button" aria-pressed="true" aria-label="Mute sound">🔊</button></div></section><p class="footer">А.П.ЕЛЬСИН | Александра Падафа</p></main>
<script>
const topics=[{word:'pizza',kind:'food'},{word:'hamburgers',kind:'food'},{word:'spaghetti',kind:'food'},{word:'fish',kind:'food'},{word:'chicken',kind:'food'},{word:'football',kind:'activity'},{word:'basketball',kind:'activity'},{word:'skiing',kind:'activity'},{word:'windsurfing',kind:'activity'},{word:'going to the cinema',kind:'activity'},{word:'eating out',kind:'activity'},{word:'dancing',kind:'activity'}];
const adjectives={food:{positive:['delicious','great','fantastic','wonderful','fine'],negative:['awful','terrible','disgusting','horrible']},activity:{positive:['exciting','interesting','enjoyable','great','fantastic','wonderful'],negative:['boring','dull','awful','terrible','horrible']}};
const state=[topics[0],'delicious',topics[5],'boring'];const labels=['1 · TOPIC','2 · POSITIVE','3 · TOPIC','4 · NEGATIVE'];const board=document.querySelector('#board');const allButton=document.querySelector('#all');let busy=false;let audioCtx=null;let soundOn=true;
const pick=(a,exclude)=>{let filtered=a.filter(v=>(typeof v==='string'?v:v.word)!==(typeof exclude==='string'?exclude:exclude?.word));if(!filtered.length)filtered=a;return filtered[Math.floor(Math.random()*filtered.length)]};
const word=v=>typeof v==='string'?v:v.word;
const poolFor=i=>i%2===0?topics.map(x=>x.word):[...new Set(Object.values(adjectives).flatMap(x=>x[i===1?'positive':'negative']))];
function createTile(i){const tile=document.createElement('div');tile.className='tile '+(i%2===0?'topic':i===1?'positive':'negative');tile.tabIndex=0;tile.setAttribute('role','button');tile.setAttribute('aria-label','Roll '+labels[i]);const label=document.createElement('div');label.className='label';label.textContent=labels[i];const scene=document.createElement('div');scene.className='scene';const cube=document.createElement('div');cube.className='cube';for(let f=0;f<6;f++){const face=document.createElement('div');face.className='face';face.textContent=f===0?word(state[i]):pick(poolFor(i));cube.appendChild(face)}scene.appendChild(cube);const shadow=document.createElement('div');shadow.className='shadow';const tap=document.createElement('div');tap.className='tap';tap.textContent='TAP TO ROLL';tile.append(label,scene,shadow,tap);tile.addEventListener('click',()=>rollOne(i));tile.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();rollOne(i)}});return tile}
for(let i=0;i<4;i++)board.appendChild(createTile(i));
function selectNew(i){if(i%2===0){state[i]=pick(topics,state[i]);const j=i+1;const kind=j===1?'positive':'negative';if(!adjectives[state[i].kind][kind].includes(state[j]))state[j]=pick(adjectives[state[i].kind][kind])}else{const kind=i===1?'positive':'negative';state[i]=pick(poolFor(i),state[i]);const j=i-1;if(!adjectives[state[j].kind][kind].includes(state[i]))state[j]=pick(topics.filter(t=>adjectives[t.kind][kind].includes(state[i])))}}
function updateFaces(i,value){const faces=board.children[i].querySelectorAll('.face');faces[0].textContent=word(value);const pool=poolFor(i);for(let f=1;f<6;f++)faces[f].textContent=pick(pool)}
function sound(count){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const sr=audioCtx.sampleRate;const now=audioCtx.currentTime+.02;const times=count===4?[0,.1,.22,.43,.67,.88,1.14]:[0,.17,.37,.67,1.12];times.forEach((offset,k)=>{const duration=k===times.length-1?.075:.04;const buffer=audioCtx.createBuffer(1,Math.ceil(sr*duration),sr);const data=buffer.getChannelData(0);for(let n=0;n<data.length;n++){const t=n/sr;data[n]=((Math.random()*2-1)*.67+Math.sin(2*Math.PI*(190-k*12)*t)*.33)*Math.exp(-t*(k===times.length-1?45:85))}const source=audioCtx.createBufferSource();source.buffer=buffer;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1200+k%3*300;const gain=audioCtx.createGain();gain.gain.value=(count===4?.18:.15)*(k===times.length-1?1.2:.75);source.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);source.start(now+offset);source.stop(now+offset+duration+.01)})}catch(e){}}
document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';e.currentTarget.setAttribute('aria-pressed',String(soundOn));e.currentTarget.setAttribute('aria-label',soundOn?'Mute sound':'Unmute sound')});
function animate(indices){busy=true;allButton.disabled=true;const unique=[...new Set(indices)];unique.forEach(i=>{board.children[i].classList.remove('landed');board.children[i].classList.add('rolling')});const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?200:1300;const started=performance.now();const timer=setInterval(()=>{const elapsed=performance.now()-started;if(elapsed>duration*.76){clearInterval(timer);unique.forEach(i=>updateFaces(i,state[i]));return}unique.forEach(i=>updateFaces(i,pick(poolFor(i))))},85);setTimeout(()=>{clearInterval(timer);unique.forEach(i=>{updateFaces(i,state[i]);board.children[i].classList.remove('rolling');board.children[i].classList.add('landed')});busy=false;allButton.disabled=false},duration+25)}
function rollOne(i){if(busy)return;const before=state.slice();selectNew(i);const partner=i%2===0?i+1:i-1;const indices=[i];if(word(before[partner])!==word(state[partner]))indices.push(partner);sound(1);animate(indices)}
allButton.addEventListener('click',()=>{if(busy)return;for(const i of [0,2]){state[i]=pick(topics,state[i]);state[i+1]=pick(adjectives[state[i].kind][i===0?'positive':'negative'],state[i+1])}sound(4);animate([0,1,2,3])});
</script></body></html>
