<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Love It or Hate It? | А.П.ЕЛЬСИН</title><style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#f4f7ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#25325b 0,transparent 40%),radial-gradient(ellipse at 100% 85%,#173b47 0,transparent 40%),#0b1020;overflow-x:hidden}.wrap{max-width:1240px;margin:auto;padding:32px 24px 24px}.sparkle{display:none}header{text-align:left;padding:10px 4px 25px}.eyebrow{display:inline-block;padding:7px 12px;border:1px solid #3a4c70;border-radius:7px;background:#18253e;color:#9dd8f8;font-size:11px;font-weight:850;letter-spacing:.16em}h1{font-size:clamp(37px,5.6vw,72px);font-weight:950;letter-spacing:-.065em;margin:14px 0 4px;line-height:1.05;color:#fff;text-transform:uppercase}h1 span{color:#fb758d!important}.subtitle{font-size:clamp(13px,1.8vw,17px);color:#a8b7d0;margin:10px 0 0;font-weight:550}.game-panel{background:#111a2e;border:1px solid #34425f;border-radius:22px;padding:22px;box-shadow:0 24px 70px #0005}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tile{border:1px solid transparent;background:transparent;border-radius:16px;padding:18px 7px 13px;cursor:pointer;text-align:center;min-width:0;transition:transform .2s,border-color .2s,background .2s;position:relative}.tile:hover{transform:translateY(-4px);border-color:transparent;background:transparent}.tile:active{transform:translateY(1px)}.label{font-size:11px;font-weight:900;letter-spacing:.11em;color:#b3c5e0}.tile.positive .label{color:#9cf2b7}.tile.negative .label{color:#ffa6b7}.scene{height:225px;display:grid;place-items:center;perspective:850px}.cube{--s:clamp(80px,10vw,127px);width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;transform:rotateX(-17deg) rotateY(-20deg) scale(1.05);}.face{position:absolute;inset:0;border-radius:3px;border:1px solid #ffffff55;display:grid;place-items:center;padding:8px;font-size:clamp(10px,1.25vw,15px);line-height:1.15;font-weight:850;overflow-wrap:anywhere;backface-visibility:hidden;box-shadow:inset -5px -7px 12px #0002,inset 3px 3px 9px #fff3;text-align:center}.face:nth-child(1){transform:translateZ(calc(var(--s)/2))}.face:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.8)}.face:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}.face:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.85)}.face:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2));filter:brightness(1.13)}.face:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.76)}.face:first-child{border:3px solid #d6ff68;box-shadow:inset 0 0 14px #d6ff6844,0 0 12px #c9fa6699,0 0 25px #b9ff4533}.tile.topic .face{background:#73cbf6;color:#102b48}.tile.positive .face{background:#a8ecb0;color:#153f2d}.tile.negative .face{background:#ff9aaf;color:#5c2037}.shadow{width:100px;height:14px;margin:-10px auto 12px;border-radius:50%;background:#0007;filter:blur(9px)}.hint{font-size:11px;color:#8fa3c1;font-weight:700;letter-spacing:.03em}.rolling .cube{animation:roll 1.15s cubic-bezier(.19,.65,.26,1) both}@keyframes roll{0%{transform:translateY(0) rotateX(-17deg) rotateY(-20deg) scale(1.05)}25%{transform:translateY(-38px) rotateX(245deg) rotateY(190deg) rotateZ(35deg) scale(.96)}60%{transform:translateY(-15px) rotateX(545deg) rotateY(505deg) rotateZ(65deg) scale(1.02)}83%{transform:translateY(-10px) rotateX(690deg) rotateY(665deg) rotateZ(10deg) scale(1.04)}100%{transform:translateY(0) rotateX(703deg) rotateY(700deg) rotateZ(0) scale(1.05)}}.tile:not(.rolling) .face:first-child{animation:face-glow .45s ease-out both}@keyframes face-glow{from{box-shadow:0 0 3px #c9fa66,inset 0 0 4px #fff4}to{box-shadow:0 0 13px #c9fa6688,0 0 32px #b9ff4544,inset 0 0 14px #ffffff55}}.actions{display:flex;justify-content:center;align-items:center;gap:12px;margin:25px 0}.soundbtn{background:#22334c;color:#e8f2ff;border:1px solid #51637c;border-radius:12px;padding:15px 18px;font-size:20px;cursor:pointer;min-width:60px}.soundbtn[aria-pressed="false"]{opacity:.65}.mainbtn{background:#c9fa66;color:#192b19;border:0;border-bottom:5px solid #7ba43b;border-radius:12px;padding:17px 52px;font-size:16px;font-weight:950;letter-spacing:.05em;cursor:pointer;box-shadow:0 10px 28px #b3ff3c20;transition:transform .2s}.mainbtn:hover{transform:translateY(-3px);filter:brightness(1.05)}.mainbtn:active{transform:translateY(2px)}.mainbtn:disabled{opacity:.7}.example{margin:0 0 18px;padding:18px 20px;background:#1b2840;border:1px solid #34435f;border-radius:14px}.example-title{font-size:11px;color:#c9fa66;font-weight:900;letter-spacing:.13em;margin-bottom:10px}.example p{font-size:clamp(14px,1.6vw,18px);line-height:1.55;margin:6px 0;color:#f4f7ff}.example small{display:block;color:#a8b7d0;margin-top:10px;font-size:12px}.face:first-child{font-size:clamp(11px,1.35vw,16px)}.face:not(:first-child){border-color:#ffffff30}.face:nth-child(5){filter:brightness(1.06)}.footer{text-align:center;margin:23px 0 0;color:#8092b2;font-size:12px;font-weight:650;letter-spacing:.03em}button:focus-visible,.tile:focus-visible{outline:3px solid #bdf67b;outline-offset:4px}@media(max-width:760px){.wrap{padding:18px 12px}.game-panel{padding:13px}.board{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.scene{height:185px}.cube{--s:clamp(82px,24vw,117px)}.face{font-size:clamp(10px,2.8vw,15px)}.tile{padding:13px 5px}.mainbtn{flex:1;padding:16px 10px}}@media(prefers-reduced-motion:reduce){.rolling .cube{animation-duration:.01s}}
</style></head><body><main class="wrap"><div class="sparkle s1" aria-hidden="true">✦</div><div class="sparkle s2" aria-hidden="true">✧</div><div class="sparkle s3" aria-hidden="true">✦</div><header><span class="eyebrow">SPOTLIGHT 6 / SPEAKING CHALLENGE</span><h1>Love It <span style="color:#e38a9c">or</span> Hate It?</h1><p class="subtitle">3D DICE · 2 OPINIONS · YOUR TURN</p></header><section class="game-panel"><div class="example"><div class="example-title">HOW TO SPEAK · EXAMPLE</div><p><strong>Pizza + delicious:</strong> I love pizza. I think it’s delicious!</p><p><strong>Football + boring:</strong> I hate football. I think it’s boring!</p></div><div class="board" id="board"></div><div class="actions"><button id="all" class="mainbtn">🎲 &nbsp; ROLL ALL FOUR</button><button id="sound" class="soundbtn" type="button" aria-label="Mute dice sound" aria-pressed="true" title="Sound on/off">🔊</button></div></section><p class="footer">А.П.ЕЛЬСИН | Александра Падафа</p></main><script>
const topics=[{word:'pizza',kind:'food',plural:false},{word:'hamburgers',kind:'food',plural:true},{word:'spaghetti',kind:'food',plural:false},{word:'fish',kind:'food',plural:false},{word:'chicken',kind:'food',plural:false},{word:'football',kind:'activity',plural:false},{word:'basketball',kind:'activity',plural:false},{word:'skiing',kind:'activity',plural:false},{word:'windsurfing',kind:'activity',plural:false},{word:'going to the cinema',kind:'activity',plural:false},{word:'eating out',kind:'activity',plural:false},{word:'dancing',kind:'activity',plural:false}];
const adjectives={food:{positive:['delicious','great','fantastic','wonderful','fine'],negative:['awful','terrible','disgusting','horrible']},activity:{positive:['exciting','interesting','enjoyable','great','fantastic','wonderful'],negative:['boring','dull','awful','terrible','horrible']}};
const state=[topics[0],'delicious',topics[5],'boring'];const labels=['1 · TOPIC','2 · POSITIVE','3 · TOPIC','4 · NEGATIVE'];const board=document.querySelector('#board');let busy=false;
function random(a,exclude){const opts=a.filter(x=>typeof x==='string'?x!==exclude:x.word!==exclude?.word);return (opts.length?opts:a)[Math.floor(Math.random()*(opts.length||a.length))]}
function isValid(topic,adj,type){return adjectives[topic.kind][type].includes(adj)}
function facesFor(i){const val=state[i];const base=i%2===0?topics.map(t=>t.word):[...new Set(Object.values(adjectives).flatMap(g=>g[i===1?'positive':'negative']))];const first=typeof val==='string'?val:val.word;return [first,...Array.from({length:5},()=>random(base))]}
function render(){board.innerHTML='';state.forEach((_,i)=>{const tile=document.createElement('div');tile.className='tile '+(i%2===0?'topic':i===1?'positive':'negative');tile.tabIndex=0;tile.setAttribute('role','button');tile.setAttribute('aria-label','Roll '+labels[i]);tile.innerHTML=`<div class="label">${labels[i]}</div><div class="scene"><div class="cube">${facesFor(i).map(x=>`<div class="face">${x}</div>`).join('')}</div></div><div class="shadow"></div>`;tile.addEventListener('click',()=>roll(i));tile.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();roll(i)}});board.appendChild(tile)})}
function choose(i){if(i===0||i===2){state[i]=random(topics,state[i]);const j=i+1;const type=j===1?'positive':'negative';if(!isValid(state[i],state[j],type))state[j]=random(adjectives[state[i].kind][type]);}else{const type=i===1?'positive':'negative';const pool=[...new Set(Object.values(adjectives).flatMap(x=>x[type]))];state[i]=random(pool,state[i]);const j=i-1;if(!isValid(state[j],state[i],type)){const matches=topics.filter(t=>isValid(t,state[i],type));state[j]=random(matches)}}}
// Short, synthesized dice-on-table sounds; no external files or network required.
let audioCtx=null;let soundOn=true;
const soundButton=document.querySelector('#sound');
soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent=soundOn?'🔊':'🔇';soundButton.setAttribute('aria-pressed',String(soundOn));soundButton.setAttribute('aria-label',soundOn?'Mute dice sound':'Unmute dice sound')});
function diceSound(count){
 if(!soundOn)return;
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!audioCtx)audioCtx=new AudioContextClass();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const sr=audioCtx.sampleRate,now=audioCtx.currentTime+.015;
  const times=count===4?[0,.10,.23,.43,.66,.86,1.05]:[0,.16,.37,.65,.99];
  times.forEach((offset,k)=>{
   const duration=.032+(k===times.length-1?.055:0);
   const buffer=audioCtx.createBuffer(1,Math.ceil(sr*duration),sr);
   const data=buffer.getChannelData(0);
   for(let n=0;n<data.length;n++){
    const t=n/sr;
    const decay=Math.exp(-t*(k===times.length-1?45:85));
    data[n]=((Math.random()*2-1)*.62+Math.sin(2*Math.PI*(175-k*9)*t)*.38)*decay;
   }
   const source=audioCtx.createBufferSource();source.buffer=buffer;
   const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1100+(k%3)*320;
   const gain=audioCtx.createGain();gain.gain.value=(count===4?.18:.15)*(k===times.length-1?1.3:.75);
   source.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);
   source.start(now+offset);source.stop(now+offset+duration+.01);
  });
 }catch(e){/* Audio is optional on restricted browsers. */}
}
function roll(i){if(busy)return;busy=true;diceSound(1);choose(i);animate([i,i%2===0?i+1:i-1])}
function animate(indices){const tiles=[...board.children];const unique=[...new Set(indices)];unique.forEach(i=>tiles[i].classList.add('rolling'));document.querySelector('#all').disabled=true;setTimeout(()=>{render();busy=false;document.querySelector('#all').disabled=false},1150)}
document.querySelector('#all').addEventListener('click',()=>{if(busy)return;busy=true;diceSound(4);[0,2].forEach(i=>{state[i]=random(topics,state[i]);state[i+1]=random(adjectives[state[i].kind][i===0?'positive':'negative'])});animate([0,1,2,3])});render();
</script></body></html>
