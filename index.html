on.negative .label{color:#ff9dbd}.stage{width:100%;height:clamp(168px,28vw,250px);position:relative;display:grid;place-items:center;perspective:620px;perspective-origin:50% 42%;transform-style:preserve-3d}.stage:before{content:"";position:absolute;width:67%;height:67%;border-radius:50%;background:radial-gradient(circle,rgba(185,255,91,.16),transparent 72%);filter:blur(16px);pointer-events:none}.stage:after{content:"";position:absolute;bottom:12%;width:45%;height:14px;border-radius:50%;background:#000a;filter:blur(12px);z-index:0}.cube{--size:clamp(112px,19vw,165px);width:var(--size);height:var(--size);position:relative;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(29deg);z-index:1;transition:transform .45s cubic-bezier(.2,.8,.2,1);-webkit-transform-style:preserve-3d}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;overflow-wrap:anywhere;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid rgba(255,255,255,.5);border-radius:9px;background:linear-gradient(135deg,var(--light),var(--base) 62%,var(--dark));box-shadow:inset 0 0 20px #ffffff24,inset -8px -8px 20px #0002;color:#101d37;font-size:clamp(12px,2.3vw,17px);line-height:1.15;font-weight:900}.face.front{transform:translateZ(calc(var(--size) / 2));border:2px solid rgba(255,255,255,.75);box-shadow:inset 0 0 20px #fff6}.face.back{transform:rotateY(180deg) translateZ(calc(var(--size) / 2))}.face.right{transform:rotateY(90deg) translateZ(calc(var(--size) / 2));background:linear-gradient(120deg,var(--dark),var(--base))}.face.left{transform:rotateY(-90deg) translateZ(calc(var(--size) / 2));background:var(--dark)}.face.top{transform:rotateX(90deg) translateZ(calc(var(--size) / 2));background:linear-gradient(135deg,#f2ffff,var(--light))}.face.bottom{transform:rotateX(-90deg) translateZ(calc(var(--size) / 2));background:var(--dark)}.topic{--light:#b4edff;--base:#68c5fa;--dark:#3694d3}.positive{--light:#d4ffe1;--base:#9df2ba;--dark:#5fcb95}.negative{--light:#ffd4e4;--base:#ff9fbe;--dark:#e96c9c}.station.rolling .cube{animation:tumble 1.28s cubic-bezier(.3,.1,.2,1) both}.station.landed .cube{animation:land .4s ease-out both}.station.rolling .stage:before{content:"";position:absolute;width:67%;height:67%;border-radius:50%;background:radial-gradient(circle,rgba(185,255,91,.16),transparent 72%);filter:blur(16px);pointer-events:none}.stage:after{animation:shadow .6s ease-in-out infinite alternate}.hint{color:#8f9bbb;font-size:10px;letter-spacing:.16em;font-weight:800;margin-top:-3px}@keyframes tumble{0%{transform:translateY(0) rotateX(-24deg) rotateY(29deg)}24%{transform:translateY(-33px) rotateX(310deg) rotateY(290deg)}53%{transform:translateY(-20px) rotateX(630deg) rotateY(610deg)}80%{transform:translateY(-8px) rotateX(696deg) rotateY(749deg)}100%{transform:translateY(0) rotateX(-24deg) rotateY(29deg)}}@keyframes land{0%{transform:translateY(-13px) rotateX(-24deg) rotateY(29deg) scale(1.06)}55%{transform:translateY(4px) rotateX(-24deg) rotateY(29deg) scale(.97)}100%{transform:translateY(0) rotateX(-24deg) rotateY(29deg) scale(1)}}@keyframes shadow{to{opacity:.3;transform:scale(.75)}}.actions{display:flex;gap:12px;max-width:610px;margin:26px auto 0}.actions button{border:0;cursor:pointer;font-weight:950}.mainbtn{flex:1;padding:18px;border-radius:17px;background:#d0ff6d;color:#172119;font-size:clamp(15px,3.8vw,20px);letter-spacing:.045em;box-shadow:0 6px 0 #7aab39,0 15px 32px #b9ff4a24}.mainbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7aab39}.mainbtn:disabled{opacity:.72}.soundbtn{min-width:60px;border-radius:17px;background:#273452;color:white;border:1px solid #58678e!important;font-size:22px}.footer{text-align:center;font-size:11px;color:#8c95b5;margin-top:22px}@media(min-width:700px){.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.stage{height:230px}.cube{--size:145px}}@media(max-width:390px){.arena{padding:18px 7px}.board{gap:22px 2px}.cube{--size:108px}.stage{height:165px}.face{font-size:12px}.example-grid{grid-template-columns:1fr}.example{margin-bottom:16px}}@media(prefers-reduced-motion:reduce){.station.rolling .cube{animation:none}}
</style></head><body><main class="wrap"><header><span class="eyebrow">SPOTLIGHT 6 · SPEAKING GAME</span><h1>LOVE IT <span>OR</span><br>HATE IT?</h1><p class="subtitle">FOUR DICE · TWO OPINIONS · YOUR TURN</p></header><section class="example"><div class="example-title">HOW TO SPEAK · EXAMPLES</div><div class="example-grid"><p><strong>Pizza + delicious:</strong> I love pizza. I think it’s delicious!</p><p><strong>Football + boring:</strong> I hate football. I think it’s boring!</p></div></section><section class="arena"><div class="board" id="board"></div><div class="actions"><button class="mainbtn" id="all">🎲 ROLL ALL FOUR</button><button class="soundbtn" id="sound" aria-label="Toggle sound">🔊</button></div></section><p class="footer">А.П.ЕЛЬСИН | Александра Падафа</p></main><script>
const topics=[['pizza','food'],['hamburgers','food'],['spaghetti','food'],['fish','food'],['chicken','food'],['football','activity'],['basketball','activity'],['skiing','activity'],['windsurfing','activity'],['going to the cinema','activity'],['eating out','activity'],['dancing','activity']].map(([word,kind])=>({word,kind}));
const adj={food:{positive:['delicious','great','fantastic','wonderful','fine'],negative:['awful','terrible','disgusting','horrible']},activity:{positive:['exciting','interesting','enjoyable','great','fantastic','wonderful'],negative:['boring','dull','awful','terrible','horrible']}};
const state=[topics[0],'delicious',topics[5],'boring'];const labels=['1 · TOPIC','2 · POSITIVE','3 · TOPIC','4 · NEGATIVE'];const board=document.getElementById('board'),all=document.getElementById('all');let busy=false,soundOn=true,ctx;
const rand=a=>a[Math.floor(Math.random()*a.length)],word=x=>typeof x==='string'?x:x.word;const pool=i=>i%2===0?topics.map(t=>t.word):[...new Set(Object.values(adj).flatMap(x=>x[i===1?'positive':'negative']))];const other=(a,old)=>rand(a.filter(x=>word(x)!==word(old)).length?a.filter(x=>word(x)!==word(old)):a);
function faces(i){return [...board.children[i].querySelectorAll('.face')]}function setFront(i,v){faces(i)[0].textContent=word(v)}function make(i){const s=document.createElement('div');s.className='station '+(i%2===0?'topic':i===1?'positive':'negative');s.tabIndex=0;s.setAttribute('role','button');s.setAttribute('aria-label','Roll '+labels[i]);const label=document.createElement('div');label.className='label';label.textContent=labels[i];const stage=document.createElement('div');stage.className='stage';const cube=document.createElement('div');cube.className='cube';['front','back','right','left','top','bottom'].forEach((f,n)=>{const face=document.createElement('div');face.className='face '+f;face.textContent=n===0?word(state[i]):rand(pool(i));cube.append(face)});stage.append(cube);const hint=document.createElement('div');hint.className='hint';hint.textContent='TAP TO ROLL';s.append(label,stage,hint);s.addEventListener('click',()=>roll(i));s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();roll(i)}});return s}for(let i=0;i<4;i++)board.append(make(i));
function choose(i){if(i%2===0){state[i]=other(topics,state[i]);const j=i+1,k=j===1?'positive':'negative';if(!adj[state[i].kind][k].includes(state[j]))state[j]=rand(adj[state[i].kind][k])}else{const j=i-1,k=i===1?'positive':'negative';state[i]=other(adj[state[j].kind][k],state[i])}}
function noise(n){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx??=new AC();ctx.resume();const t=ctx.currentTime;[0,.13,.3,.55,.82,1.12].forEach((delay,i)=>{const dur=.045,sr=ctx.sampleRate,b=ctx.createBuffer(1,Math.floor(sr*dur),sr),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.exp(-j/sr*75);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();filter.type='lowpass';filter.frequency.value=950+i*120;g.gain.value=(n===4?.19:.13)*(i===5?1.3:.7);src.buffer=b;src.connect(filter);filter.connect(g);g.connect(ctx.destination);src.start(t+delay)})}catch(e){}}
function animate(ids){busy=true;all.disabled=true;ids.forEach(i=>{const s=board.children[i];s.classList.remove('landed');void s.offsetWidth;s.classList.add('rolling')});const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?180:1280;let tick=0;const interval=setInterval(()=>{tick++;ids.forEach(i=>{const p=pool(i);setFront(i,rand(p))})},95);setTimeout(()=>{clearInterval(interval);ids.forEach(i=>setFront(i,state[i]))},duration-330);setTimeout(()=>{ids.forEach(i=>{const s=board.children[i];s.classList.remove('rolling');s.classList.add('landed')});busy=false;all.disabled=false},duration)}
function roll(i){if(busy)return;const before=state.slice();choose(i);const j=i%2===0?i+1:i-1;const ids=[i];if(word(before[j])!==word(state[j]))ids.push(j);noise(1);animate(ids)}all.addEventListener('click',()=>{if(busy)return;for(const i of [0,2]){state[i]=other(topics,state[i]);state[i+1]=other(adj[state[i].kind][i===0?'positive':'negative'],state[i+1])}noise(4);animate([0,1,2,3])});document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇'});
</script></body></html>
